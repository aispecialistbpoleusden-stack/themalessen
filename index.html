  light: {label:'Verkeerslicht', svg:`<svg viewBox="0 0 30 60"><rect x="5" y="4" width="20" height="52" rx="6" fill="#111"/><circle cx="15" cy="16" r="5" fill="#ef4444"/><circle cx="15" cy="30" r="5" fill="#fbbf24"/><circle cx="15" cy="44" r="5" fill="#10b981"/></svg>`},
  sign: {label:'Verkeersbord', svg:`<svg viewBox="0 0 40 40"><polygon points="20,3 37,35 3,35" fill="#fff" stroke="#dc2626" stroke-width="3"/></svg>`}
};

function renderTrafficBoard(act, tid){
  const card = h('div',{class:'student-act'});
  card.appendChild(h('h3',{},'🚦 Verkeerssituatie'));
  if(act.question) card.appendChild(h('p',{style:{marginBottom:'8px'}},act.question));
  const board = h('div',{class:'board road'});
  card.appendChild(board);
  const palette = h('div',{class:'palette'});
  card.appendChild(palette);

  const itemsRef = ref(db,`responses/${tid}/${act.id}/items`);

  function makePaletteItem(k){
    const v = VEHICLES[k]; if(!v) return null;
    const isPiece = k.startsWith('road-') || k==='tree' || k==='bush';
    return h('div',{class:'palette-item'+(isPiece?' piece':''), html:`${v.svg}<span>${v.label}</span>`, onclick:()=>{
      const key = uid();
      update(itemsRef, {[key]:{type:k, x:0.5, y:0.5, rot:0, by:state.user.name, klass:state.user.klass}});
    }});
  }

  const roadKeys = (act.vehicles||[]).filter(k=>k.startsWith('road-'));
  const vehKeys  = (act.vehicles||[]).filter(k=>['car','truck','bus','bike','ped','light','sign'].includes(k));
  const natKeys  = (act.vehicles||[]).filter(k=>['tree','bush'].includes(k));

  function addGroup(title, keys){
    if(!keys.length) return;
    palette.appendChild(h('div',{class:'palette-group-title'}, title));
    keys.forEach(k=>{ const el = makePaletteItem(k); if(el) palette.appendChild(el); });
  }
  addGroup('🛣️ Wegen', roadKeys);
  addGroup('🚗 Voertuigen', vehKeys);
  addGroup('🌳 Natuur', natKeys);

  const nodeMap = {};
  const unsub = onValue(itemsRef, snap=>{
    const data = snap.val()||{};
    Object.keys(nodeMap).forEach(k=>{ if(!data[k]){ nodeMap[k].remove(); delete nodeMap[k]; }});
    Object.entries(data).forEach(([key,it])=>{
      if(!nodeMap[key]){
        const v = VEHICLES[it.type]||{label:'?', svg:''};
        const isPiece = it.type.startsWith('road-') || it.type==='tree' || it.type==='bush';
        const el = h('div',{class:'drag-item'+(isPiece?' piece':''), dataset:{key}});
        const inner = h('div',{class:'inner', html:`${v.svg}${isPiece?'':`<div class="label">${esc(it.by||'')}</div>`}`});
        const rotor = h('div',{class:'rotor', title:'Sleep om te draaien • klik = +15°'},'🔄');
        el.append(inner, rotor);
        board.appendChild(el);
        bindTrafficDrag(el, key, itemsRef, board);
        bindRotor(el, inner, key, itemsRef);
        nodeMap[key] = el;
      }
      const el = nodeMap[key];
      if(!el.matches(':active') && !el.classList.contains('rotating')){
        el.style.left = (it.x*100)+'%';
        el.style.top = (it.y*100)+'%';
      }
      const inner = el.querySelector('.inner');
      if(!el.classList.contains('rotating')){
        inner.style.transform = `rotate(${(it.rot||0)}deg)`;
      }
    });
  });
  track(unsub);
  return card;
}

function bindTrafficDrag(el, key, itemsRef, board){
  let dragging=false, ox=0, oy=0;
  el.addEventListener('pointerdown', e=>{
    if(e.target.classList.contains('rotor')) return;
    dragging=true; el.setPointerCapture(e.pointerId);
    const r=el.getBoundingClientRect(); ox=e.clientX-r.left; oy=e.clientY-r.top;
  });
  el.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const br = board.getBoundingClientRect();
    let x=(e.clientX-br.left-ox)/br.width, y=(e.clientY-br.top-oy)/br.height;
    x=Math.max(0,Math.min(1,x)); y=Math.max(0,Math.min(1,y));
    el.style.left=(x*100)+'%'; el.style.top=(y*100)+'%';
    clearTimeout(el._t);
    el._t = setTimeout(()=>update(itemsRef, {[key+'/x']:x, [key+'/y']:y}), 60);
  });
  const stop = ()=>dragging=false;
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointercancel', stop);
}

function bindRotor(el, inner, key, itemsRef){
  const rotor = el.querySelector('.rotor');
  if(!rotor) return;
  let rotating=false;
  let startAngle = 0, startRot = 0, centerX = 0, centerY = 0;
  let clickTimeout = null;
  let dragStarted = false;

  function getCenter(){
    const r = el.getBoundingClientRect();
    return {cx: r.left + r.width/2, cy: r.top + r.height/2};
  }
  function getAngle(px, py){
    const {cx, cy} = getCenter();
    return Math.atan2(py-cy, px-cx) * 180 / Math.PI;
  }

  rotor.addEventListener('pointerdown', e=>{
    e.preventDefault(); e.stopPropagation();
    rotating = true; dragStarted = false;
    el.classList.add('rotating');
    rotor.setPointerCapture(e.pointerId);
    const {cx, cy} = getCenter();
    centerX = cx; centerY = cy;
    startAngle = Math.atan2(e.clientY-cy, e.clientX-cx) * 180 / Math.PI;
    const cur = (el.dataset.rot ? parseFloat(el.dataset.rot) : 0);
    startRot = cur;
    clearTimeout(clickTimeout);
  });

  rotor.addEventListener('pointermove', e=>{
    if(!rotating) return;
    dragStarted = true;
    const a = Math.atan2(e.clientY-centerY, e.clientX-centerX) * 180 / Math.PI;
    let delta = a - startAngle;
    let newRot = startRot + delta;
    if(!e.shiftKey){
      newRot = Math.round(newRot / 15) * 15;
    }
    newRot = ((newRot % 360) + 360) % 360;
    el.dataset.rot = newRot;
    inner.style.transform = `rotate(${newRot}deg)`;
  });

  function endRotate(e){
    if(!rotating) return;
    rotating = false;
    el.classList.remove('rotating');
    if(!dragStarted){
      const cur = parseFloat(el.dataset.rot || 0);
      const step = e && e.shiftKey ? -15 : 15;
      const newRot = ((cur + step) % 360 + 360) % 360;
      el.dataset.rot = newRot;
      inner.style.transform = `rotate(${newRot}deg)`;
      update(itemsRef, {[key+'/rot']: newRot});
    } else {
      const cur = parseFloat(el.dataset.rot || 0);
      update(itemsRef, {[key+'/rot']: cur});
    }
  }
  rotor.addEventListener('pointerup', endRotate);
  rotor.addEventListener('pointercancel', endRotate);
}

/* ================= WHITEBOARD ================= */
function renderWhiteboard(act, tid){
  const card = h('div',{class:'student-act'});
  card.appendChild(h('h3',{},'🎨 '+(act.title||'Samen tekenen')));
  const canvas = h('canvas',{class:'whiteboard'});
  card.appendChild(canvas);
  const tools = h('div',{class:'wb-tools'});
  card.appendChild(tools);

  const colors = ['#111827','#dc2626','#2563eb','#10b981','#fbbf24'];
  let color = colors[0];
  colors.forEach((c,i)=>{
    const dot = h('div',{class:'color-dot'+(i===0?' active':''), style:{background:c}, onclick:()=>{
      color = c; $$('.color-dot', tools).forEach((d,j)=>d.classList.toggle('active',j===i));
    }});
    tools.appendChild(dot);
  });
  tools.appendChild(h('button',{class:'btn ghost small', onclick:()=>{
    if(confirm('Whiteboard wissen voor iedereen?')) remove(ref(db,`responses/${tid}/${act.id}/strokes`));
  }},'🧽 Wissen'));

  const ctx = canvas.getContext('2d');
  setTimeout(()=>{
    canvas.width = canvas.clientWidth || 800;
    canvas.height = canvas.clientHeight || 450;
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  },0);

  function draw(s){
    ctx.strokeStyle = s.color; ctx.lineWidth = s.w*canvas.width; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(s.x1*canvas.width, s.y1*canvas.height);
    ctx.lineTo(s.x2*canvas.width, s.y2*canvas.height);
    ctx.stroke();
  }

  const strokesRef = ref(db,`responses/${tid}/${act.id}/strokes`);
  const unsub = onChildAdded(strokesRef, snap=>{ draw(snap.val()); });
  track(unsub);

  let drawing=false, last=null;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height};
  }
  canvas.addEventListener('pointerdown', e=>{ drawing=true; last=pos(e); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e=>{
    if(!drawing) return;
    const p = pos(e);
    const s = {x1:last.x, y1:last.y, x2:p.x, y2:p.y, color, w:0.005};
    draw(s); push(strokesRef, s); last = p;
  });
  const stop = ()=>drawing=false;
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);
  return card;
}

/* ================= DOCENT LISTENERS ================= */
function setupTeacherListeners(){
  onValue(ref(db,'themes'), snap=>{
    state.themes = snap.val()||{};
    renderThemeList();
    renderEditor();
  });
  onValue(ref(db,'pushes'), snap=>{
    state.pushes = snap.val()||{};
    renderThemeList();
    renderPushedList();
    renderEditor();
  });
  onValue(ref(db,'objectives'), snap=>{
    state.objectives = snap.val()||{};
    renderEditor();
  });
  onValue(ref(db,'subjects'), snap=>{
    state.subjects = snap.val()||{};
    renderEditor();
  });
}

/* ================= student LISTENERS ================= */
function setupStudentListeners(){
  if(studentPushUnsub){ studentPushUnsub(); studentPushUnsub = null; }
  if(studentThemeUnsub){ studentThemeUnsub(); studentThemeUnsub = null; }

  const cls = state.user.klass;
  studentPushUnsub = onValue(ref(db,'pushes/'+cls), snap=>{
    const newId = snap.val();
    if(newId === state.myPushedId) return;
    state.myPushedId = newId;
    if(studentThemeUnsub){ studentThemeUnsub(); studentThemeUnsub = null; }
    if(newId){
      studentThemeUnsub = onValue(ref(db,'themes/'+newId), s2=>{
        const newTheme = s2.val();
        const sig = JSON.stringify(Object.keys(
          (newTheme?.activities||[]).reduce((a,x)=>(a[x.id]=x.type,a),{})
        )) + '|' + (newTheme?.name||'') + '|' + (newTheme?.description||'');
        const prev = state._lastSig;
        state.pushedTheme = newTheme;
        if(sig !== prev){
          state._lastSig = sig;
          renderStudent();
        }
      });
      toast('🎉 Nieuwe les gestart!','success');
    } else {
      state.pushedTheme = null;
      state._lastSig = null;
      renderStudent();
    }
  });
}

/* ================= MAIN RENDER ================= */
function render(){
  clearTracked();
  const root = $('#app');
  root.innerHTML = '';
  if(!state.user){ root.appendChild(renderLogin()); return; }
  if(state.user.role==='docent'){
    root.appendChild(renderTeacher());
    setupTeacherListeners();
  } else {
    renderStudent();
    setupStudentListeners();
  }
}

/* ================= BOOT ================= */
render();
window.addEventListener('beforeunload', ()=>{
  if(state.user && state.user.id){
    set(ref(db,'users/'+state.user.id+'/online'), false).catch(()=>{});
  }
});
</script>
