<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Themalessen Platform</title>
<style>
:root{
  --primary:#1e3a8a;
  --primary-2:#2563eb;
  --accent:#fbbf24;
  --accent-2:#facc15;
  --ok:#10b981;
  --danger:#dc2626;
  --bg:#0a1428;
  --card:#0f1e38;
  --card2:#162a4a;
  --text:#e8eef9;
  --muted:#8fa3c0;
  --border:#26436b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:radial-gradient(1200px 700px at 15% -10%,#12294e,#0a1428 60%);color:var(--text);min-height:100vh;overflow-x:hidden;padding-top:3px}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#1e3a8a 0%,#1e3a8a 45%,#fbbf24 45%,#fbbf24 55%,#1e3a8a 55%,#1e3a8a 100%);z-index:1000;pointer-events:none}
button{font-family:inherit;cursor:pointer;border:none}
input,textarea,select{font-family:inherit}
.btn{padding:10px 16px;border-radius:10px;background:var(--card2);color:var(--text);font-weight:600;font-size:14px;transition:.15s;border:1px solid var(--border)}
.btn:hover{transform:translateY(-1px);background:#1d3660;border-color:#3a5c92}
.btn.primary{background:var(--primary-2);border:none;box-shadow:0 3px 10px rgba(37,99,235,.35);color:#fff}
.btn.primary:hover{background:#1d4ed8;box-shadow:0 5px 16px rgba(37,99,235,.5)}
.btn.danger{background:var(--danger);border:none;color:#fff}
.btn.ok{background:var(--ok);border:none;color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--border)}
.btn.ghost:hover{background:rgba(251,191,36,.08);border-color:var(--accent)}
.btn.small{padding:6px 10px;font-size:12px}
.btn.full{width:100%}
.input,textarea.input,select.input{width:100%;padding:11px 14px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;transition:.15s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(251,191,36,.15)}
.input.big{font-size:20px;font-weight:700;padding:14px 16px}
textarea.input{resize:vertical;min-height:80px;line-height:1.5}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}

.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{width:100%;max-width:460px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;box-shadow:0 30px 60px rgba(0,0,0,.55);border-top:3px solid var(--accent)}
.login-card h1{font-size:28px;text-align:center;color:var(--text);letter-spacing:.5px}
.login-card .subtitle{text-align:center;color:var(--muted);margin:8px 0 24px;font-size:14px}
.tabs{display:flex;gap:6px;background:var(--card2);padding:6px;border-radius:12px;margin-bottom:20px}
.tab{flex:1;padding:10px;border-radius:8px;background:transparent;color:var(--muted);font-weight:600;font-size:13px}
.tab.active{background:var(--primary-2);color:#fff}
.login-body{display:flex;flex-direction:column;gap:12px}
.class-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.class-btn{padding:12px 8px;border-radius:10px;background:var(--card2);border:1px solid var(--border);color:var(--text);font-weight:700;font-size:13px;letter-spacing:.5px;transition:.15s}
.class-btn:hover{background:#1d3660;border-color:#3a5c92;transform:translateY(-1px)}
.class-btn.active{background:var(--primary-2);border-color:var(--accent);color:#fff;box-shadow:0 0 0 2px rgba(251,191,36,.35)}

.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:rgba(15,30,56,.9);backdrop-filter:blur(12px);border-bottom:2px solid var(--accent);position:sticky;top:3px;z-index:100}
.brand{font-weight:800;font-size:18px;color:var(--text);letter-spacing:.3px}
.brand .shield{color:var(--accent);font-weight:900;margin-right:6px}
.user-info{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}

.main-grid{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 60px)}
.sidebar{padding:20px;border-right:1px solid var(--border);background:rgba(15,30,56,.55)}
.sidebar h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:20px 0 10px}
.sidebar h2:first-child{margin-top:0}
.theme-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.theme-item{padding:14px;border-radius:12px;background:var(--card2);border:1px solid var(--border);border-left:3px solid transparent;cursor:pointer;transition:.15s}
.theme-item:hover{background:#1d3660;transform:translateX(2px)}
.theme-item.active{border-color:var(--primary-2);border-left-color:var(--accent);background:linear-gradient(135deg,rgba(37,99,235,.15),rgba(37,99,235,.06))}
.theme-item .name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.theme-item .sub{font-size:12px;color:var(--muted);margin-top:4px}
.push-badge{font-size:10px;padding:2px 6px;border-radius:10px;background:rgba(251,191,36,.18);color:var(--accent);font-weight:700}

.pushed-list{display:flex;flex-direction:column;gap:6px}
.pushed-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--card2);border-radius:8px;font-size:12px;border:1px solid var(--border);border-left:2px solid var(--accent)}
.pushed-row .cls{font-weight:800;letter-spacing:.5px;color:var(--accent)}
.pushed-row .thm{flex:1;color:var(--muted);margin:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.editor{padding:28px;max-width:900px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:420px;color:var(--muted);font-size:15px;border:2px dashed var(--border);border-radius:16px;text-align:center;padding:30px}
.editor-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.act-list{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.act-card{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:16px;transition:.15s;border-left:3px solid var(--primary-2)}
.act-card:hover{border-color:#3a5c92}
.act-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.act-controls{display:flex;gap:6px}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:rgba(37,99,235,.22);color:#93c5fd}
.add-bar{display:flex;flex-wrap:wrap;gap:8px;padding:16px;background:var(--card2);border-radius:14px;border:1px dashed var(--border);margin-top:16px}
.add-bar .btn{font-size:12px}
.push-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:var(--card2);border-radius:12px;border:1px solid var(--border);border-left:3px solid var(--accent);margin-top:12px}

.ts-group{margin-top:12px;padding:12px;background:var(--card);border-radius:12px;border:1px solid var(--border)}
.ts-group h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin-bottom:8px;font-weight:700}
.ts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.ts-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;background:var(--card2);border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:.15s;position:relative}
.ts-tile:hover{border-color:var(--accent);background:#1d3660;transform:translateY(-1px)}
.ts-tile.active{border-color:var(--accent);background:rgba(251,191,36,.1);box-shadow:0 0 0 2px rgba(251,191,36,.25)}
.ts-tile svg{width:44px;height:44px;pointer-events:none}
.ts-tile .name{font-size:11px;font-weight:600;color:var(--text);text-align:center;line-height:1.2}
.ts-tile .check{position:absolute;top:4px;right:6px;font-size:14px;color:var(--accent);opacity:0;transition:.15s}
.ts-tile.active .check{opacity:1}
.ts-hint{font-size:11px;color:var(--muted);margin-top:6px;font-style:italic}

.student-wrap{max-width:1100px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:20px}
.hero{background:linear-gradient(135deg,rgba(30,58,138,.55),rgba(37,99,235,.35));border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:20px;padding:28px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;right:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(251,191,36,.08),transparent 70%);pointer-events:none}
.hero h1{font-size:32px;margin-bottom:8px;position:relative;color:#fff}
.hero .meta{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.chip{padding:6px 12px;background:rgba(255,255,255,.08);border-radius:20px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.1)}
.chip.objective{background:rgba(37,99,235,.25);color:#bfdbfe;border-color:rgba(37,99,235,.4)}
.chip.class{background:rgba(251,191,36,.18);color:var(--accent);border-color:rgba(251,191,36,.4)}
.student-acts{display:flex;flex-direction:column;gap:20px}
.student-act{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;animation:slideUp .4s ease both;border-left:3px solid var(--accent)}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.student-act h3{font-size:19px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.student-act p{line-height:1.7;color:#cbd5e1}
.student-act img{max-width:100%;border-radius:12px;margin-top:8px}
.student-act iframe{width:100%;aspect-ratio:16/9;border:none;border-radius:12px;margin-top:8px;background:#000}

.feed{display:flex;flex-direction:column;gap:10px;margin-top:14px;max-height:340px;overflow-y:auto;padding:4px}
.feed-item{background:var(--card2);padding:12px 14px;border-radius:12px;border-left:3px solid var(--accent);animation:slideUp .3s ease both}
.feed-item .who{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.feed-item .msg{margin-top:6px;line-height:1.5;font-size:14px;white-space:pre-wrap;word-break:break-word}
.answer-row{display:flex;gap:10px;margin-top:12px}
.answer-row textarea{flex:1}

.quiz-q{background:var(--card2);padding:16px;border-radius:12px;margin-bottom:12px;border-left:2px solid var(--primary-2)}
.quiz-q .qtext{font-weight:600;margin-bottom:10px}
.quiz-opt{display:block;padding:10px 14px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;margin:6px 0;cursor:pointer;transition:.15s}
.quiz-opt:hover{background:rgba(37,99,235,.12);border-color:var(--primary-2)}
.quiz-opt.correct{background:rgba(16,185,129,.2);border-color:var(--ok);color:#6ee7b7}
.quiz-opt.wrong{background:rgba(220,38,38,.18);border-color:var(--danger);color:#fca5a5}
.quiz-opt input{margin-right:10px}
.quiz-score{margin-top:12px;padding:10px 14px;border-radius:10px;background:rgba(251,191,36,.12);border-left:3px solid var(--accent);font-weight:700;font-size:14px;color:var(--accent)}

.board{position:relative;width:100%;aspect-ratio:16/10;background:linear-gradient(135deg,#0f1e38,#0a1428);border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-top:12px}
.board.road{background:#5a7a4a;background-image:
  radial-gradient(circle at 20% 30%,rgba(255,255,255,.04),transparent 40%),
  radial-gradient(circle at 70% 60%,rgba(255,255,255,.04),transparent 40%),
  radial-gradient(circle at 45% 85%,rgba(0,0,0,.06),transparent 40%);
  border:2px solid #3d5c30}

.drag-item{position:absolute;cursor:grab;user-select:none;display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:none;transform-origin:center center}
.drag-item:active{cursor:grabbing}
.drag-item .rotor{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:var(--primary-2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:grab;border:2px solid var(--accent);z-index:20;touch-action:none;box-shadow:0 2px 6px rgba(0,0,0,.5);transition:transform .1s}
.drag-item .rotor:hover{transform:translateX(-50%) scale(1.15)}
.drag-item .rotor:active{cursor:grabbing;transform:translateX(-50%) scale(1.25)}
.drag-item.rotating{outline:2px dashed var(--accent);outline-offset:6px;border-radius:8px}
.drag-item svg{width:44px;height:60px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));pointer-events:none}
.drag-item .label{font-size:10px;font-weight:700;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:6px;pointer-events:none;white-space:nowrap;color:#fff}
.drag-item.piece svg{width:110px;height:110px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.drag-item .inner{display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}

.palette{display:flex;flex-wrap:wrap;gap:10px;padding:10px;background:var(--card2);border-radius:12px;margin-top:12px}
.palette-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:8px;cursor:pointer;transition:.15s;min-width:64px;border:1px solid transparent}
.palette-item:hover{background:rgba(251,191,36,.1);border-color:var(--accent)}
.palette-item svg{width:32px;height:44px;pointer-events:none}
.palette-item.piece svg{width:52px;height:52px}
.palette-item span{font-size:10px;color:var(--muted);text-align:center;line-height:1.2;pointer-events:none}
.palette-group-title{width:100%;font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
.palette-group-title:first-child{margin-top:0}
canvas.whiteboard{width:100%;aspect-ratio:16/9;background:#fff;border-radius:14px;cursor:crosshair;touch-action:none;display:block}
.wb-tools{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s}
.color-dot.active{border-color:#fff;transform:scale(1.15)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);padding:12px 22px;border-radius:12px;background:var(--card2);border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.5);font-weight:600;font-size:14px;opacity:0;transition:.3s;z-index:9999;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.error{background:var(--danger);border-color:var(--danger);color:#fff}
.toast.success{background:var(--ok);border-color:var(--ok);color:#fff}
.toast.info{background:var(--primary-2);border:none;color:#fff}

/* ===== Meerdere vakken per thema ===== */
.subject-header{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;padding:10px 16px;background:linear-gradient(90deg,rgba(251,191,36,.18),transparent);border-left:4px solid var(--accent);border-radius:8px}
.subject-header h3{font-size:14px;letter-spacing:.5px;color:var(--accent);text-transform:uppercase;font-weight:800}
.subject-header .subject-count{font-size:11px;color:var(--muted);font-weight:600}
.subject-select{padding:4px 10px;border-radius:8px;background:rgba(251,191,36,.12);color:var(--accent);border:1px solid rgba(251,191,36,.35);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;outline:none;font-family:inherit}
.subject-select option{background:var(--card2);color:var(--text);text-transform:none;font-weight:500}
.subjects-manager{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px;background:var(--card2);border-radius:12px;border:1px dashed var(--border);margin-top:6px;margin-bottom:10px}
.subject-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(251,191,36,.15);color:var(--accent);border:1px solid rgba(251,191,36,.35);border-radius:20px;font-size:12px;font-weight:700}
.subject-chip .remove{background:transparent;border:none;color:var(--accent);cursor:pointer;font-size:14px;padding:0 2px;opacity:.7;line-height:1}
.subject-chip .remove:hover{opacity:1;color:var(--danger)}
.hero .chip.subject{background:rgba(251,191,36,.18);color:var(--accent);border-color:rgba(251,191,36,.4)}

/* ===== Doelstellingen per vak ===== */
.obj-panel{margin-top:10px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.02);overflow:hidden}
.obj-panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:rgba(37,99,235,.10);border-bottom:1px solid var(--border)}
.obj-panel-head h4{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#bfdbfe;font-weight:800}
.obj-panel-head .hint{font-size:11px;color:var(--muted);font-weight:600}
.obj-subject{padding:12px 16px}
.obj-subject + .obj-subject{border-top:1px solid rgba(38,67,107,.55)}
.obj-subject-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.obj-subject-head .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.65}
.obj-subject-head .nm{font-size:12px;font-weight:800;letter-spacing:.4px;color:#dbe6f7;text-transform:uppercase}
.obj-subject-head .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}
.obj-chips{display:flex;flex-direction:column;gap:6px}
.obj-chip{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(251,191,36,.05);border:1px solid rgba(251,191,36,.16);border-left:2px solid rgba(251,191,36,.45);border-radius:9px;font-size:13px;cursor:pointer;transition:.15s}
.obj-chip:hover{background:rgba(251,191,36,.10);border-color:rgba(251,191,36,.32);transform:translateX(2px)}
.obj-chip.active{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.55);box-shadow:inset 0 0 0 1px rgba(251,191,36,.18)}
.obj-chip .txt{flex:1;color:#dbe6f7;line-height:1.45}
.obj-chip .rm{background:transparent;border:none;color:var(--muted);font-size:12px;padding:2px 5px;border-radius:6px;cursor:pointer;line-height:1}
.obj-chip .rm:hover{color:#fff;background:rgba(220,38,38,.5)}
.obj-empty{font-size:12px;color:var(--muted);font-style:italic;padding:2px 0 4px}
.obj-add{display:flex;gap:8px;margin-top:8px}
.obj-add .input{padding:8px 12px;font-size:13px}
.obj-add .btn{padding:8px 12px;font-size:12px}

/* ===== Beroepsproduct ===== */
.bp-wrap{display:grid;grid-template-columns:280px 1fr;gap:16px;margin-top:12px}
@media(max-width:900px){.bp-wrap{grid-template-columns:1fr}}
.bp-checklist{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;position:sticky;top:80px;align-self:start}
.bp-checklist h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);font-weight:800;margin-bottom:10px}
.bp-check{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer;transition:.15s;color:#dbe6f7;line-height:1.4}
.bp-check:hover{background:rgba(251,191,36,.07)}
.bp-check input{margin-top:2px;accent-color:var(--accent);cursor:pointer}
.bp-check.done span{color:var(--muted);text-decoration:line-through}
.bp-check .bullet{color:var(--accent);font-weight:800;flex-shrink:0}
.bp-editor-area{display:flex;flex-direction:column;gap:10px}
.bp-variant{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:rgba(37,99,235,.2);color:#93c5fd;border:1px solid rgba(37,99,235,.4);border-radius:20px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.bp-variant.mutatie{background:rgba(16,185,129,.2);color:#6ee7b7;border-color:rgba(16,185,129,.4)}
.bp-variant.aangifte{background:rgba(220,38,38,.2);color:#fca5a5;border-color:rgba(220,38,38,.4)}
.bp-variant.bevindingen{background:rgba(251,191,36,.2);color:var(--accent);border-color:rgba(251,191,36,.4)}
.bp-casus{padding:12px 16px;background:rgba(37,99,235,.10);border-left:3px solid var(--primary-2);border-radius:10px;margin-bottom:12px;line-height:1.65;color:#dbe6f7;white-space:pre-wrap;font-size:14px}
.bp-textarea{min-height:340px;font-family:ui-monospace,'Courier New',monospace;font-size:14px;line-height:1.65;padding:16px}
.bp-count{font-size:11px;color:var(--muted);text-align:right}
.bp-status{font-size:12px;color:var(--muted)}
.bp-list{margin-top:14px;padding:12px;background:var(--card2);border-radius:10px;border:1px solid var(--border)}
.bp-list h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);font-weight:800;margin-bottom:8px}
.bp-list-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(38,67,107,.4);font-size:12px}

<script type="module">

import { getDatabase, ref, set, push, onValue, update, remove, onChildAdded, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyCxJTc6nhg0_s3KtxTn4aRmIkFVoXwptSI",
  authDomain: "themalessen-d43d8.firebaseapp.com",

/* ================= KLASSEN ================= */
const CLASSES = ['ALPHA','BRAVO','CHARLIE','DELTA','ECHO','FOXTROT','GOLF','HOTEL','JULIETT','KILO','LIMA','MIKE'];

/* ================= STANDAARD VAKKEN ================= */
const DEFAULT_SUBJECTS = [
  'Algemeen Juridisch',
  'Gedrag & Communicatie',
  'BeroepsTaalVaardigheid',
  'Engels',
  'Eerste Hulp door Politie'

/* ================= BEROEPSPRODUCT ================= */
const BP_VARIANTS = {
  'mutatie':        {label:'Mutatie (ASTMA)', badge:'mutatie'},
  'pv-aangifte':    {label:'PV Aangifte',     badge:'aangifte'},
  'pv-bevindingen': {label:'PV Bevindingen',  badge:'bevindingen'}
};
const BP_DEFAULT_CHECKLISTS = {

    'A – Aanleiding van de mutatie',

  'pv-aangifte': [

    'Gouden W\'s beantwoord (wie, wat, waar, wanneer, waarom, waarmee, hoe)',

    'Onvoltooid verleden tijd gebruikt',
    'Redenen van wetenschap vermeld'
  ],
  'pv-bevindingen': [
    'Bestanddeelteksten volledig ingevuld',
    'Gouden W\'s beantwoord (wie, wat, waar, wanneer, waarom, waarmee, hoe)',
    'Decorbeschrijvingen opgenomen',
    'Onvoltooid verleden tijd gebruikt',
    'Redenen van wetenschap vermeld',
    'Ambtshandelingen beschreven'
  ]
};
function defaultBPChecklist(variant){
  return [...(BP_DEFAULT_CHECKLISTS[variant] || BP_DEFAULT_CHECKLISTS.mutatie)];
}

/* ================= VAKKEN PER THEMA ================= */
function getThemeSubjects(theme){
  if(!theme) return [];
  const out = [];
  if(theme.subject) out.push(theme.subject);
  (theme.subjects||[]).forEach(s=>{ if(s && !out.includes(s)) out.push(s); });
  return out;
}
async function addSubjectToTheme(tid, name){
  if(!name || !name.trim()) return;
  const theme = state.themes[tid]; if(!theme) return;
  const cur = getThemeSubjects(theme);
  const nm = name.trim();
  if(cur.includes(nm)) return;
  const newSubs = [...cur, nm];
  await update(ref(db,'themes/'+tid), {
    subjects: newSubs,
    subject: '',        // migreer legacy veld
    updatedAt: Date.now()
  });
}
async function removeSubjectFromTheme(tid, name){
  const theme = state.themes[tid]; if(!theme) return;
  const newSubs = getThemeSubjects(theme).filter(s=>s!==name);
  const acts = (theme.activities||[]).map(a => a.subject===name ? {...a, subject:''} : a);
  await update(ref(db,'themes/'+tid), {
    subjects: newSubs,
    subject: '',
    activities: acts,
    updatedAt: Date.now()
  });
}

/* ================= DOELSTELLINGEN PER VAK ================= */
function getSubjectObjectives(subject){
  const out = [];
  for(const o of Object.values(state.objectives||{})){
    if(!o || !o.text) continue;
    if((o.subject||'') === (subject||'') && !out.includes(o.text)) out.push(o.text);
  }
  return out;
}
async function addObjective(text, subject=''){
  const t = String(text||'').trim();
  if(!t) return;
  if(getSubjectObjectives(subject).includes(t)) return;
  await update(ref(db,'objectives/'+uid()), {text:t, subject:subject||''});
}
async function removeObjective(text, subject=''){
  const entry = Object.entries(state.objectives||{})
    .find(([_,o])=>o && o.text===text && (o.subject||'')===(subject||''));
  if(!entry) return;
  await remove(ref(db,'objectives/'+entry[0]));
}

/* ================= UTIL ================= */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
function h(tag, props={}, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(v===false||v==null) continue;
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k==='style' && typeof v==='object') Object.assign(e.style, v);
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c=>{
    if(c==null||c===false) return;
    e.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  });
  return e;
}
function toast(msg, type='info'){
  const t = h('div', {class:`toast ${type}`}, msg);
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);}, 2500);
}
const uid = ()=> 'x'+Math.random().toString(36).slice(2,10);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= STATE ================= */
const state = {
  userId: (()=>{ let id=localStorage.getItem('userId'); if(!id){id='u_'+Math.random().toString(36).slice(2,10); localStorage.setItem('userId',id);} return id; })(),
  user: JSON.parse(localStorage.getItem('user')||'null'),
  themes: {},
  pushes: {},
  pushedTheme: null,
  myPushedId: null,
  editingThemeId: null,
  objectives: {},
  subjects: {}
};
const listeners = [];
const track = u => { if(typeof u === 'function') listeners.push(u); };
function clearTracked(){ while(listeners.length){ try{listeners.pop()();}catch(e){} } }

/* ================= THEMA AANMAKEN ================= */
async function createNewTheme(){
  const name = prompt('Naam van het nieuwe thema:');
  if(!name || !name.trim()) return;
  const id = 't_' + Math.random().toString(36).slice(2,10);
  try {
    await set(ref(db,'themes/'+id), {
      name: name.trim(),
      subject: '',
      subjects: [],
      description: '',
      objective: '',
      activities: [],
      createdAt: Date.now(),
      updatedAt: Date.now()
    });
    state.editingThemeId = id;
    toast('Thema "'+name.trim()+'" aangemaakt!','success');
    setTimeout(()=>{ renderThemeList(); renderEditor(); }, 80);
  } catch(e){
    console.error('Kon thema niet aanmaken:', e);
    toast('Kon thema niet aanmaken: '+e.message, 'error');
  }
}

/* ================= DATA HELPERS ================= */
function updateActivity(themeId, idx, patch){
  const theme = state.themes[themeId]; if(!theme) return;
  const acts = [...(theme.activities||[])];
  acts[idx] = {...acts[idx], ...patch};
  update(ref(db,'themes/'+themeId), {activities: acts, updatedAt:Date.now()});
}
function moveActivity(themeId, idx, dir){
  const acts = [...(state.themes[themeId].activities||[])];
  const cur = acts[idx]; if(!cur) return;
  const curSub = cur.subject || '';
  let j = idx + dir;
  while(j >= 0 && j < acts.length){
    if((acts[j].subject||'') === curSub) break;
    j += dir;
  }
  if(j < 0 || j >= acts.length) return;
  [acts[idx],acts[j]]=[acts[j],acts[idx]];
  update(ref(db,'themes/'+themeId),{activities:acts, updatedAt:Date.now()});
  renderEditor();
}
function removeActivity(themeId, idx){
  if(!confirm('Activiteit verwijderen?')) return;
  const acts = [...(state.themes[themeId].activities||[])];
  acts.splice(idx,1);
  update(ref(db,'themes/'+themeId),{activities:acts, updatedAt:Date.now()});
  renderEditor();
}
function addActivity(themeId, type, subject=''){
  const base = {id:uid(), type, order:Date.now(), subject};
  if(type==='text'){ base.title=''; base.body=''; }
  if(type==='image'){ base.url=''; base.caption=''; }
  if(type==='youtube'){ base.url=''; base.caption=''; }
  if(type==='iframe'){ base.url=''; base.title=''; }
  if(type==='openq'){ base.question=''; base.hint=''; }
  if(type==='quiz'){ base.questions=[]; }
  if(type==='drag'){ base.title='Sleepopdracht'; base.items=[]; }
  if(type==='whiteboard'){ base.title='Samen tekenen'; }
  if(type==='traffic'){
    base.question = '';
    base.vehicles = ['road-straight','road-curve-left','road-curve-right','tree','bush','car','truck','bus','bike','ped','light','sign'];
  }
  if(type==='beroepsproduct'){
    base.title = 'Beroepsproduct';
    base.variant = 'mutatie';
    base.casus = '';
    base.checklist = defaultBPChecklist('mutatie');
    base.feedPublic = false;
  }
  const acts = [...(state.themes[themeId].activities||[]), base];
  update(ref(db,'themes/'+themeId),{activities:acts, updatedAt:Date.now()});
  setTimeout(renderEditor, 200);
}

/* ================= LOGIN ================= */
function renderLogin(){
  const wrap = h('div',{class:'login-wrap'});
  const card = h('div',{class:'login-card'});
  card.append(
    h('h1',{},'🚔 Themalessen'),
    h('p',{class:'subtitle'},'Kies je rol om verder te gaan')
  );
  const tabs = h('div',{class:'tabs'});
  const tabS = h('button',{class:'tab active'},'👨‍🎓 student');
  const tabT = h('button',{class:'tab'},'👮 Docent');
  tabs.append(tabS,tabT); card.appendChild(tabs);
  const body = h('div',{class:'login-body'}); card.appendChild(body);

  function showStudent(){
    tabS.classList.add('active'); tabT.classList.remove('active'); body.innerHTML='';
    body.appendChild(h('label',{},'Kies je klas'));
    let selectedClass = localStorage.getItem('studentClass') || '';
    const grid = h('div',{class:'class-grid'});
    CLASSES.forEach(c=>{
      const btn = h('button',{class:'class-btn'+(c===selectedClass?' active':''), onclick:()=>{
        selectedClass = c;
        $$('.class-btn', grid).forEach(b=>b.classList.toggle('active', b.textContent===c));
      }}, c);
      grid.appendChild(btn);
    });
    body.appendChild(grid);
    body.appendChild(h('label',{},'Jouw naam'));
    const nameInput = h('input',{class:'input', placeholder:'bv. Sara', value:localStorage.getItem('studentName')||''});
    body.appendChild(nameInput);
    body.appendChild(h('button',{class:'btn primary', style:{marginTop:'8px'}, onclick:()=>{
      const n = nameInput.value.trim();
      if(!selectedClass) return toast('Kies eerst een klas','error');
      if(!n) return toast('Vul je naam in','error');
      localStorage.setItem('studentName', n);
      localStorage.setItem('studentClass', selectedClass);
      loginAs({id:state.userId, name:n, role:'student', klass:selectedClass});
    }},'Deelnemen aan les'));
  }
  function showTeacher(){
    tabT.classList.add('active'); tabS.classList.remove('active'); body.innerHTML='';
    const pw = h('input',{class:'input', type:'password', placeholder:'Wachtwoord'});
    body.append(
      pw,
      h('button',{class:'btn primary', onclick:()=>{
        if(pw.value!=='docent') return toast('Onjuist wachtwoord','error');
        loginAs({id:state.userId, name:'Docent', role:'docent'});
      }},'Inloggen als docent')
    );
    pw.addEventListener('keydown', e=>{ if(e.key==='Enter') pw.nextSibling.click(); });
    setTimeout(()=>pw.focus(),50);
  }
  tabS.onclick = showStudent;
  tabT.onclick = showTeacher;
  showStudent();

  wrap.appendChild(card);
  return wrap;
}

function loginAs(user){
  state.user = user;
  localStorage.setItem('user', JSON.stringify(user));
  try {
    set(ref(db,'users/'+user.id), {name:user.name, role:user.role, klass:user.klass||null, lastSeen:Date.now()}).catch(e=>console.warn(e));
    const od = onDisconnect(ref(db,'users/'+user.id+'/online'));
    if (od && od.set) od.set(false).catch?.(()=>{});
    set(ref(db,'users/'+user.id+'/online'), true).catch(()=>{});
  } catch(e){ console.warn('Firebase niet bereikbaar:', e); }
  render();
}
function logout(){
  if(state.user) set(ref(db,'users/'+state.user.id+'/online'), false).catch(()=>{});
  state.user = null;
  state.editingThemeId = null;
  state.pushedTheme = null;
  state.myPushedId = null;
  state._lastSig = null;
  localStorage.removeItem('user');
  clearTracked();
  render();
}

/* ================= DOCENT ================= */
function renderTeacher(){
  const wrap = h('div');
  wrap.appendChild(h('header',{class:'topbar'},
    h('div',{class:'brand'}, h('span',{class:'shield'},'★'),'Themalessen – Docent'),
    h('div',{class:'user-info'},
      h('span',{},'👮 Docent'),
      h('button',{class:'btn ghost small', onclick:logout},'Uitloggen')
    )
  ));
  const main = h('div',{class:'main-grid'});
  const sidebar = h('aside',{class:'sidebar'});
  sidebar.append(
    h('h2',{},'Thema\'s'),
    h('button',{class:'btn primary full', onclick:createNewTheme},'+ Nieuw thema'),
    h('div',{class:'theme-list', id:'theme-list'}),
    h('h2',{},'Actieve pushes'),
    h('div',{class:'pushed-list', id:'pushed-list'})
  );
  const editor = h('section',{class:'editor', id:'editor'});
  main.append(sidebar, editor);
  wrap.appendChild(main);
  setTimeout(()=>{ renderThemeList(); renderPushedList(); renderEditor(); },0);
  return wrap;
}

function renderThemeList(){
  const list = $('#theme-list'); if(!list) return;
  list.innerHTML='';
  const entries = Object.entries(state.themes).sort((a,b)=>(b[1].updatedAt||0)-(a[1].updatedAt||0));
  if(!entries.length){
    list.appendChild(h('div',{style:{color:'var(--muted)',fontSize:'13px',padding:'10px'}},'Nog geen thema\'s'));
    return;
  }
  for(const [id,t] of entries){
    const pushedTo = Object.entries(state.pushes).filter(([_,v])=>v===id).map(([k])=>k);
    const item = h('div',{class:'theme-item'+(state.editingThemeId===id?' active':''), onclick:()=>{ state.editingThemeId=id; renderEditor(); renderThemeList(); }},
      h('div',{class:'name'},
        h('span',{}, t.name||'Naamloos thema'),
        pushedTo.length ? h('span',{class:'push-badge'}, '● '+pushedTo.length) : null
      ),
      h('div',{class:'sub'},
        (getThemeSubjects(t).join(' · ') || 'Geen vakken') +
        ' • ' + ((t.activities||[]).length) + ' activiteiten' +
        (pushedTo.length? ' • '+pushedTo.join(', ') : '')
      )
    );
    list.appendChild(item);
  }
}

function renderPushedList(){
  const el = $('#pushed-list'); if(!el) return;
  el.innerHTML='';
  const entries = Object.entries(state.pushes);
  if(!entries.length){
    el.appendChild(h('div',{style:{color:'var(--muted)',fontSize:'12px',padding:'6px'}},'Geen klas heeft nu een thema'));
    return;
  }
  for(const [cls, tid] of entries){
    const theme = state.themes[tid];
    el.appendChild(h('div',{class:'pushed-row'},
      h('span',{class:'cls'},cls),
      h('span',{class:'thm'}, theme ? (theme.name||'Onbekend') : '(verwijderd thema)'),
      h('button',{class:'btn danger small', onclick:()=>{
        set(ref(db,'pushes/'+cls), null);
        toast('Push voor '+cls+' gestopt','info');
      }},'✕')
    ));
  }
}

function renderEditor(){
  const ed = $('#editor'); if(!ed) return;
  ed.innerHTML='';
  const tid = state.editingThemeId;
  if(!tid || !state.themes[tid]){
    const empty = h('div',{class:'empty-state'});
    empty.append(
      h('div',{style:{fontSize:'52px'}},'🚔'),
      h('div',{style:{fontSize:'17px',fontWeight:'600',color:'var(--text)'}},'Nog geen thema geselecteerd'),
      h('p',{style:{maxWidth:'380px',lineHeight:'1.6'}},'Kies links een bestaand thema, of maak hieronder je eerste thema aan om mee te beginnen.'),
      h('button',{class:'btn primary', onclick:createNewTheme},'+ Nieuw thema aanmaken')
    );
    ed.appendChild(empty);
    return;
  }
  const theme = state.themes[tid];
  const themeSubjects = getThemeSubjects(theme);

  /* ---------- KOP + VERWIJDEREN ---------- */
  const head = h('div',{class:'editor-header'});
  head.appendChild(h('div',{style:{flex:'1', minWidth:'260px'}},
    h('label',{},'Naam van het thema'),
    h('input',{class:'input big', value:theme.name||'', oninput:e=>update(ref(db,'themes/'+tid),{name:e.target.value, updatedAt:Date.now()})})
  ));
  head.appendChild(h('div',{style:{display:'flex',gap:'8px',alignItems:'flex-end'}},
    h('button',{class:'btn danger small', onclick:async()=>{
      if(!confirm('Thema definitief verwijderen?')) return;
      for(const [cls, val] of Object.entries(state.pushes)){
        if(val===tid) await set(ref(db,'pushes/'+cls), null);
      }
      await remove(ref(db,'themes/'+tid));
      state.editingThemeId=null; toast('Verwijderd','info');
    }},'Verwijder thema')
  ));
  ed.appendChild(head);

  /* ---------- VAKGEBIEDEN (meerdere) ---------- */
  ed.appendChild(h('label',{},'Vakgebieden (meerdere mogelijk)'));
  const manager = h('div',{class:'subjects-manager'});
  if(!themeSubjects.length){
    manager.appendChild(h('span',{style:{color:'var(--muted)',fontSize:'13px'}},'Nog geen vakken — voeg hieronder toe'));
  }
  themeSubjects.forEach(s=>{
    manager.appendChild(h('span',{class:'subject-chip'},
      s,
      h('button',{class:'remove', title:'Vak verwijderen van thema', onclick:()=>{
        if(!confirm('Vak "'+s+'" van dit thema verwijderen? Activiteiten van dit vak worden op "Algemeen" gezet.')) return;
        removeSubjectFromTheme(tid, s);
      }},'✕')
    ));
  });
  // toevoegen-select
  const addSubj = h('select',{class:'subject-select', style:{fontSize:'12px', padding:'6px 10px', minWidth:'180px'}});
  addSubj.appendChild(h('option',{value:''},'➕ Vak toevoegen…'));
  const customSubjects = Object.values(state.subjects||{}).map(s=>s.name).filter(Boolean);
  const allSubjects = [...new Set([...DEFAULT_SUBJECTS, ...customSubjects])].sort((a,b)=>a.localeCompare(b,'nl'));
  allSubjects.forEach(s=>{
    if(!themeSubjects.includes(s)) addSubj.appendChild(h('option',{value:s},s));
  });
  addSubj.appendChild(h('option',{value:'__new'},'➕ Nieuw vak…'));
  addSubj.onchange = async e=>{
    const v = e.target.value; if(!v) return;
    if(v==='__new'){
      const n = prompt('Naam van het nieuwe vak:');
      if(n && n.trim()){
        const nm = n.trim();
        await update(ref(db,'subjects/'+uid()), {name:nm});
        await addSubjectToTheme(tid, nm);

        const objs = prompt('Doelstellingen voor "'+nm+'" (één per regel, mag leeg blijven):');
        if(objs && objs.trim()){
          for(const line of objs.split('\n').map(s=>s.trim()).filter(Boolean)){
            await addObjective(line, nm);
          }
        }
        toast('Vak "'+nm+'" toegevoegd','success');
      }
    } else {
      await addSubjectToTheme(tid, v);
    }
    e.target.value='';
  };
  manager.appendChild(addSubj);
  ed.appendChild(manager);

  /* ---------- DOELSTELLING VAN DIT THEMA ---------- */
  ed.appendChild(h('label',{},'Doelstelling van dit thema'));
  const objSelect = h('select',{class:'input', onchange:async e=>{
    if(e.target.value==='__new'){
      const v = prompt('Nieuwe algemene doelstelling:');
      if(v && v.trim()){
        await addObjective(v.trim(), '');
        await update(ref(db,'themes/'+tid), {objective:v.trim(), updatedAt:Date.now()});
      }
      return;
    }
    update(ref(db,'themes/'+tid),{objective:e.target.value, updatedAt:Date.now()});
  }});
  objSelect.appendChild(h('option',{value:''},'— Kies een doelstelling —'));

  let currentFound = false;
  themeSubjects.forEach(s=>{
    const list = getSubjectObjectives(s);
    if(!list.length) return;
    const grp = h('optgroup',{label:'📘 '+s});
    list.forEach(o=>{
      const opt = h('option',{value:o},o);
      if(o===theme.objective){ opt.selected = true; currentFound = true; }
      grp.appendChild(opt);
    });
    objSelect.appendChild(grp);
  });
  const genObjs = getSubjectObjectives('');
  if(genObjs.length){
    const grp = h('optgroup',{label:'⚪ Algemeen'});
    genObjs.forEach(o=>{
      const opt = h('option',{value:o},o);
      if(o===theme.objective){ opt.selected = true; currentFound = true; }
      grp.appendChild(opt);
    });
    objSelect.appendChild(grp);
  }
  if(theme.objective && !currentFound){
    const opt = h('option',{value:theme.objective}, theme.objective);
    opt.selected = true;
    objSelect.appendChild(opt);
  }
  objSelect.appendChild(h('option',{value:'__new'},'➕ Nieuwe doelstelling toevoegen…'));
  ed.appendChild(objSelect);

  /* ---------- DOELSTELLINGEN PER VAK ---------- */
  const objPanel = h('div',{class:'obj-panel'});
  objPanel.appendChild(h('div',{class:'obj-panel-head'},
    h('h4',{},'Doelstellingen per vak'),
    h('span',{class:'hint'},'Klik op een doelstelling om die aan dit thema te koppelen')
  ));

  function subjectObjBlock(subject){
    const list = getSubjectObjectives(subject);
    const block = h('div',{class:'obj-subject'});
    block.appendChild(h('div',{class:'obj-subject-head'},
      h('span',{class:'dot'}),
      h('span',{class:'nm'}, subject || 'Algemeen'),
      h('span',{class:'cnt'}, list.length + (list.length===1?' doelstelling':' doelstellingen'))
    ));

    const chips = h('div',{class:'obj-chips'});
    if(!list.length){
      chips.appendChild(h('div',{class:'obj-empty'},
        subject ? 'Nog geen doelstellingen voor dit vak' : 'Nog geen algemene doelstellingen'));
    }
    list.forEach(o=>{
      const chip = h('div',{class:'obj-chip'+(o===theme.objective?' active':''), title:'Koppel aan dit thema'},
        h('span',{class:'txt'}, o),
        h('button',{class:'rm', title:'Doelstelling verwijderen', onclick:async e=>{
          e.stopPropagation();
          if(!confirm('Doelstelling verwijderen?')) return;
          await removeObjective(o, subject);
        }},'✕')
      );
      chip.addEventListener('click', ()=>{
        update(ref(db,'themes/'+tid),{objective:o, updatedAt:Date.now()});
      });
      chips.appendChild(chip);
    });
    block.appendChild(chips);

    const inp = h('input',{class:'input',
      placeholder: subject ? 'Nieuwe doelstelling voor '+subject+'…' : 'Nieuwe algemene doelstelling…'});
    const add = h('button',{class:'btn primary small', onclick:async ()=>{
      const v = inp.value.trim(); if(!v) return;
      await addObjective(v, subject);
      inp.value='';
    }},'+ Toevoegen');
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); add.click(); }});
    block.appendChild(h('div',{class:'obj-add'}, inp, add));
    return block;
  }

  if(themeSubjects.length){
    themeSubjects.forEach(s=> objPanel.appendChild(subjectObjBlock(s)));
  } else {
    objPanel.appendChild(h('div',{class:'obj-subject'},
      h('div',{class:'obj-empty'},'Voeg eerst een vakgebied toe — daarna kun je hier per vak doelstellingen noteren.')
    ));
  }
  objPanel.appendChild(subjectObjBlock(''));
  ed.appendChild(objPanel);

  /* ---------- BESCHRIJVING ---------- */
  ed.appendChild(h('label',{},'Beschrijving van het thema'));
  ed.appendChild(h('textarea',{class:'input', rows:4, placeholder:'Waar gaat dit thema over?', oninput:e=>update(ref(db,'themes/'+tid),{description:e.target.value, updatedAt:Date.now()})}, theme.description||''));

  /* ---------- PUSH-BALK ---------- */
  const pushBar = h('div',{class:'push-bar'});
  pushBar.appendChild(h('strong',{style:{fontSize:'13px',color:'var(--accent)'}},'🚀 Push naar:'));
  const sel = h('select',{class:'input', style:{maxWidth:'200px'}});
  sel.appendChild(h('option',{value:'__ALL__'},'ALLE KLASSEN'));
  CLASSES.forEach(c=>sel.appendChild(h('option',{value:c},c)));
  pushBar.appendChild(sel);
  pushBar.appendChild(h('button',{class:'btn primary small', onclick:async()=>{
    const target = sel.value;
    if(target==='__ALL__'){
      const updates = {};
      CLASSES.forEach(c=>updates['pushes/'+c] = tid);
      await update(ref(db), updates);
      toast('Gepusht naar alle klassen!','success');
    } else {
      await set(ref(db,'pushes/'+target), tid);
      toast('Gepusht naar '+target+'!','success');
    }
  }},'Push nu'));
  const current = Object.entries(state.pushes).find(([_,v])=>v===tid);
  if(current){
    pushBar.appendChild(h('button',{class:'btn ghost small', onclick:async()=>{
      for(const [cls, val] of Object.entries(state.pushes)){
        if(val===tid) await set(ref(db,'pushes/'+cls), null);
      }
      toast('Push gestopt','info');
    }},'⏹ Stop alle pushes van dit thema'));
  }
  ed.appendChild(pushBar);

  /* ---------- ACTIVITEITEN GEGROEPEERD PER VAK ---------- */
  const activities = theme.activities||[];
  const groups = {};
  activities.forEach((a,i)=>{
    const s = a.subject || '';
    if(!groups[s]) groups[s] = [];
    groups[s].push({a, i});
  });
  const orderedSubjects = [];
  themeSubjects.forEach(s=>{ if(groups[s]) orderedSubjects.push(s); });
  Object.keys(groups).forEach(s=>{
    if(s && !themeSubjects.includes(s)) orderedSubjects.push(s);
  });
  if(groups['']) orderedSubjects.push('');

  if(!orderedSubjects.length){
    ed.appendChild(h('div',{class:'empty-state', style:{minHeight:'180px', marginTop:'16px'}},
      h('div',{style:{fontSize:'38px'}},'📚'),
      h('p',{},'Nog geen activiteiten. Voeg hieronder je eerste activiteit toe en kies aan welk vak die hoort.')
    ));
  }

  orderedSubjects.forEach(subj=>{
    ed.appendChild(h('div',{class:'subject-header'},
      h('h3',{}, subj ? '📘 '+subj : '⚪ Algemeen (geen vak)'),
      h('span',{class:'subject-count'}, groups[subj].length + ' item' + (groups[subj].length===1?'':'s'))
    ));
    const list = h('div',{class:'act-list'});
    groups[subj].forEach(({a, i})=>{
      list.appendChild(renderActivityEditor(a, i, tid, themeSubjects));
    });
    ed.appendChild(list);
  });

  /* ---------- ADD-BAR MET VAK-SELECTOR ---------- */
  const addBar = h('div',{class:'add-bar'});
  addBar.appendChild(h('div',{style:{width:'100%', fontSize:'11px', color:'var(--accent)', fontWeight:'700', textTransform:'uppercase', letterSpacing:'.5px'}},
    'Nieuwe activiteit toevoegen aan:'
  ));
  let addSubject = themeSubjects[0] || '';
  const addSubjSel = h('select',{class:'subject-select', style:{fontSize:'12px', padding:'6px 10px', minWidth:'200px'}});
  addSubjSel.appendChild(h('option',{value:''},'⚪ Algemeen (geen vak)'));
  themeSubjects.forEach(s=>{
    const o = h('option',{value:s},'📘 '+s);
    if(s===addSubject) o.selected=true;
    addSubjSel.appendChild(o);
  });
  addSubjSel.onchange = e=>{ addSubject = e.target.value; };
  addBar.appendChild(addSubjSel);

  const types = [
    ['text','📝 Tekst'],['image','🖼️ Afbeelding'],['youtube','▶️ YouTube'],
    ['iframe','🌐 Website'],['openq','💬 Open vraag'],['quiz','🧠 Quiz'],
    ['beroepsproduct','📋 Beroepsproduct'],
    ['drag','🖱️ Sleepopdracht'],['whiteboard','🎨 Whiteboard'],['traffic','🚦 Verkeerssituatie']
  ];
  for(const [t,l] of types){
    addBar.appendChild(h('button',{class:'btn small', onclick:()=>addActivity(tid,t,addSubject)}, l));
  }
  ed.appendChild(addBar);
}

/* ================= ACTIVITY EDITORS ================= */
const TYPE_LABELS = {text:'Tekst', image:'Afbeelding', youtube:'YouTube', iframe:'Website', openq:'Open vraag', quiz:'Quiz', drag:'Sleepopdracht', whiteboard:'Whiteboard', traffic:'Verkeerssituatie', beroepsproduct:'Beroepsproduct'};

function renderActivityEditor(act, idx, tid, themeSubjects=[]){
  const card = h('div',{class:'act-card'});

  const subjSel = h('select',{class:'subject-select', title:'Vak van deze activiteit',
    onchange:e=>updateActivity(tid, idx, {subject:e.target.value})});
  subjSel.appendChild(h('option',{value:''},'— Algemeen —'));
  themeSubjects.forEach(s=>{
    const o = h('option',{value:s},s);
    if(s === (act.subject||'')) o.selected = true;
    subjSel.appendChild(o);
  });

  card.appendChild(h('div',{class:'act-header'},
    h('div',{style:{display:'flex',gap:'8px',alignItems:'center',flexWrap:'wrap'}},
      h('span',{class:'badge'}, TYPE_LABELS[act.type]||act.type),
      subjSel
    ),
    h('div',{class:'act-controls'},
      h('button',{class:'btn ghost small', onclick:()=>moveActivity(tid,idx,-1)},'↑'),
      h('button',{class:'btn ghost small', onclick:()=>moveActivity(tid,idx,1)},'↓'),
      h('button',{class:'btn danger small', onclick:()=>removeActivity(tid,idx)},'✕')
    )
  ));
  const body = h('div',{class:'act-body'});
  const upd = patch => updateActivity(tid, idx, patch);

  if(act.type==='text'){
    body.append(
      h('input',{class:'input', placeholder:'Kop', value:act.title||'', oninput:e=>upd({title:e.target.value})}),
      h('textarea',{class:'input', placeholder:'Tekst…', rows:4, style:{marginTop:'8px'}, oninput:e=>upd({body:e.target.value})}, act.body||'')
    );
  }
  else if(act.type==='image'){
    body.append(
      h('input',{class:'input', placeholder:'https://afbeelding.jpg', value:act.url||'', oninput:e=>upd({url:e.target.value})}),
      h('input',{class:'input', placeholder:'Onderschrift', style:{marginTop:'8px'}, value:act.caption||'', oninput:e=>upd({caption:e.target.value})})
    );
  }
  else if(act.type==='youtube'){
    body.append(
      h('input',{class:'input', placeholder:'YouTube link', value:act.url||'', oninput:e=>upd({url:e.target.value})}),
      h('input',{class:'input', placeholder:'Omschrijving', style:{marginTop:'8px'}, value:act.caption||'', oninput:e=>upd({caption:e.target.value})})
    );
  }
  else if(act.type==='iframe'){
    body.append(
      h('input',{class:'input', placeholder:'Titel', value:act.title||'', oninput:e=>upd({title:e.target.value})}),
      h('input',{class:'input', placeholder:'https://website.nl', style:{marginTop:'8px'}, value:act.url||'', oninput:e=>upd({url:e.target.value})})
    );
  }
  else if(act.type==='openq'){
    body.append(
      h('input',{class:'input', placeholder:'Vraag', value:act.question||'', oninput:e=>upd({question:e.target.value})}),
      h('input',{class:'input', placeholder:'Hint (optioneel)', style:{marginTop:'8px'}, value:act.hint||'', oninput:e=>upd({hint:e.target.value})})
    );
  }
  else if(act.type==='quiz'){
    const qs = act.questions||[];
    const wrap = h('div');
    qs.forEach((q,qi)=>{
      const qc = h('div',{class:'quiz-q'});
      qc.append(
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',gap:'8px'}},
          h('strong',{},'Vraag '+(qi+1)),
          h('button',{class:'btn danger small', onclick:()=>{const n=[...qs]; n.splice(qi,1); upd({questions:n}); renderEditor();}},'✕')
        ),
        h('select',{class:'input', style:{marginTop:'8px'}, onchange:e=>{const n=[...qs]; n[qi]={...q, qtype:e.target.value}; upd({questions:n}); renderEditor();}},
          ...[['open','Open vraag'],['mc','Meerkeuze'],['auto','Kort antwoord (auto-correctie)']].map(([v,l])=>{
            const o=h('option',{value:v},l); if(q.qtype===v)o.selected=true; return o;
          })
        ),
        h('input',{class:'input', placeholder:'Vraag', style:{marginTop:'8px'}, value:q.q||'', oninput:e=>{const n=[...qs]; n[qi]={...q, q:e.target.value}; upd({questions:n});}})
      );
      if(q.qtype==='mc'){
        const opts = q.options||['','','',''];
        opts.forEach((o,oi)=>{
          qc.appendChild(h('div',{style:{display:'flex',gap:'8px',marginTop:'6px',alignItems:'center'}},
            h('input',{type:'radio', name:'mc_'+act.id+'_'+qi, checked:q.correct===oi, onchange:()=>{const n=[...qs]; n[qi]={...q, correct:oi}; upd({questions:n});}}),
            h('input',{class:'input', value:o, placeholder:'Optie '+(oi+1), oninput:e=>{const nn=[...opts]; nn[oi]=e.target.value; const n=[...qs]; n[qi]={...q, options:nn}; upd({questions:n});}})
          ));
        });
        qc.appendChild(h('button',{class:'btn ghost small', style:{marginTop:'8px'}, onclick:()=>{const n=[...qs]; n[qi]={...q, options:[...(q.options||[]),'']}; upd({questions:n}); renderEditor();}},'+ Optie'));
      } else if(q.qtype==='auto'){
        qc.appendChild(h('input',{class:'input', placeholder:'Correct antwoord (| voor meerdere)', style:{marginTop:'8px'}, value:q.answer||'', oninput:e=>{const n=[...qs]; n[qi]={...q, answer:e.target.value}; upd({questions:n});}}));
      }
      wrap.appendChild(qc);
    });
    wrap.appendChild(h('button',{class:'btn primary small', onclick:()=>upd({questions:[...qs,{qtype:'open', q:''}]})},'+ Vraag toevoegen'));
    body.appendChild(wrap);
  }
  else if(act.type==='beroepsproduct'){
    /* ---------- VARIANT ---------- */
    body.appendChild(h('label',{},'Variant van het beroepsproduct'));
    const vSel = h('select',{class:'input', onchange:e=>{
      const variant = e.target.value;
      upd({variant, checklist: defaultBPChecklist(variant)});
      renderEditor();
    }});
    Object.entries(BP_VARIANTS).forEach(([v,info])=>{
      const o = h('option',{value:v}, info.label);
      if((act.variant||'mutatie')===v) o.selected = true;
      vSel.appendChild(o);
    });
    body.appendChild(vSel);

    /* ---------- TITEL ---------- */
    body.appendChild(h('label',{},'Titel / opdracht voor de student'));
    body.appendChild(h('input',{class:'input', placeholder:'bv. Schrijf een mutatie over de aangetroffen situatie',
      value:act.title||'', oninput:e=>upd({title:e.target.value})}));

    /* ---------- CASUS ---------- */
    body.appendChild(h('label',{},'Casus / context voor de student'));
    body.appendChild(h('textarea',{class:'input', rows:6, placeholder:'Beschrijf de situatie die de student moet uitwerken…',
      oninput:e=>upd({casus:e.target.value})}, act.casus||''));

    /* ---------- CHECKLIST ---------- */
    body.appendChild(h('label',{},'Checklist-eisen (één per regel — student vinkt ze af tijdens het schrijven)'));
    const cl = Array.isArray(act.checklist) ? act.checklist : defaultBPChecklist(act.variant||'mutatie');
    cl.forEach((item,i)=>{
      body.appendChild(h('div',{style:{display:'flex',gap:'8px',marginBottom:'6px'}},
        h('input',{class:'input', value:item, oninput:e=>{
          const n=[...cl]; n[i]=e.target.value; upd({checklist:n});
        }}),
        h('button',{class:'btn danger small', onclick:()=>{
          const n=[...cl]; n.splice(i,1); upd({checklist:n}); renderEditor();
        }},'✕')
      ));
    });
    body.appendChild(h('button',{class:'btn ghost small', onclick:()=>upd({checklist:[...cl,'Nieuwe eis…']})},'+ Eis toevoegen'));
    body.appendChild(h('button',{class:'btn ghost small', style:{marginLeft:'8px'},
      onclick:()=>upd({checklist: defaultBPChecklist(act.variant||'mutatie')})},'↺ Standaard-eisen herstellen'));

    /* ---------- LIVE FEED TOGGLE ---------- */
    const feedOn = !!act.feedPublic;
    const toggle = h('label',{class:'bp-toggle '+(feedOn?'on':'off'), title:'Bepaal of studenten elkaars ingeleverde teksten in de livefeed zien'},
      h('input',{type:'checkbox', checked:feedOn, onchange:e=>{
        upd({feedPublic: e.target.checked});
        renderEditor();
      }}),
      h('div',{class:'lbl'},
        h('strong',{}, feedOn ? '📡 Live feed AAN' : '🔒 Live feed UIT'),
        h('small',{}, feedOn
          ? 'Studenten zien elkaars ingeleverde teksten in real-time'
          : 'Alleen jij (docent) ziet de volledige teksten — studenten zien enkel namen')
      )
    );
    body.appendChild(toggle);

    /* ---------- INZENDINGEN BEKIJKEN ---------- */
    body.appendChild(h('div',{style:{marginTop:'12px'}},
      h('button',{class:'btn small', onclick:()=>openSubmissionsModal(tid, act)}, '📥 Bekijk inzendingen van studenten')
    ));
  }
  else if(act.type==='drag'){
    const items = act.items||[];
    body.append(
      h('input',{class:'input', placeholder:'Titel van de sleepopdracht', value:act.title||'', oninput:e=>upd({title:e.target.value})}),
      h('label',{},'Items'),
      ...items.map((it,ii)=>h('div',{style:{display:'flex',gap:'8px',marginBottom:'6px'}},
        h('input',{class:'input', value:it, oninput:e=>{const n=[...items]; n[ii]=e.target.value; upd({items:n});}}),
        h('button',{class:'btn danger small', onclick:()=>{const n=[...items]; n.splice(ii,1); upd({items:n}); renderEditor();}},'✕')
      )),
      h('button',{class:'btn ghost small', onclick:()=>upd({items:[...items,'Item '+(items.length+1)]})},'+ Item')
    );
  }
  else if(act.type==='whiteboard'){
    body.appendChild(h('input',{class:'input', placeholder:'Titel', value:act.title||'', oninput:e=>upd({title:e.target.value})}));
    body.appendChild(h('p',{style:{color:'var(--muted)',fontSize:'13px',marginTop:'8px'}},'Een gedeeld whiteboard waarop alle studenten tegelijk kunnen tekenen.'));
  }
  else if(act.type==='traffic'){
    const veh = act.vehicles||[];
    body.append(
      h('input',{class:'input', placeholder:'Opdracht (bv. "Maak een kruispunt met voorrangssituatie")', value:act.question||'', oninput:e=>upd({question:e.target.value})})
    );

    function tileGroup(title, keys, hint){
      const g = h('div',{class:'ts-group'});
      g.appendChild(h('h4',{},title));
      const grid = h('div',{class:'ts-grid'});
      keys.forEach(k=>{
        const v = VEHICLES[k]; if(!v) return;
        const on = veh.includes(k);
        const tile = h('div',{class:'ts-tile'+(on?' active':''), html:`<span class="check">✓</span>${v.svg}<span class="name">${v.label}</span>`,
          onclick:()=>{
            const cur = (state.themes[tid].activities[idx].vehicles)||[];
            const n = cur.includes(k) ? cur.filter(x=>x!==k) : [...cur,k];
            upd({vehicles:n});
            tile.classList.toggle('active');
          }});
        grid.appendChild(tile);
      });
      g.appendChild(grid);
      if(hint) g.appendChild(h('div',{class:'ts-hint'},hint));
      return g;
    }

    body.appendChild(tileGroup('🛣️ Wegen', ['road-straight','road-curve-left','road-curve-right'], 'Rechte weg, bochten — klik om aan/uit te zetten.'));
    body.appendChild(tileGroup('🚗 Voertuigen', ['car','truck','bus','bike','ped','light','sign']));
    body.appendChild(tileGroup('🌳 Natuur', ['tree','bush']));
    body.appendChild(h('div',{class:'ts-hint'},'💡 studenten kunnen elk geplaatst element draaien met de ronde knop boven het element.'));
  }
  card.appendChild(body);
  return card;
}

/* ================= DOCENT: INZENDINGEN MODAL ================= */
function openSubmissionsModal(tid, act){
  let unsub = ()=>{};
  const overlay = h('div',{style:{
    position:'fixed',inset:'0',background:'rgba(0,0,0,.72)',zIndex:9999,
    display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'
  }});
  const modal = h('div',{style:{
    background:'var(--card)',border:'1px solid var(--border)',borderRadius:'16px',
    maxWidth:'900px',width:'100%',maxHeight:'85vh',overflow:'auto',padding:'24px',
    position:'relative',boxShadow:'0 30px 60px rgba(0,0,0,.6)'
  }});
  const close = ()=>{ try{unsub();}catch(e){} overlay.remove(); };
  modal.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px',gap:'10px',flexWrap:'wrap'}},
    h('h3',{style:{margin:0}},'📥 Inzendingen – '+(act.title||'Beroepsproduct')),
    h('button',{class:'btn ghost small', onclick:close},'✕ Sluiten')
  ));
  const list = h('div');
  modal.appendChild(list);
  overlay.appendChild(modal);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  document.body.appendChild(overlay);

  const subsRef = ref(db,`responses/${tid}/${act.id}/submissions`);
  unsub = onValue(subsRef, snap=>{
    const data = snap.val()||{};
    const arr = Object.entries(data)
      .map(([k,v])=>({...v, uid:k}))
      .filter(x=>x && x.text)
      .sort((a,b)=>(b.ts||0)-(a.ts||0));
    list.innerHTML='';
    if(!arr.length){
      list.appendChild(h('p',{style:{color:'var(--muted)'}},'Nog geen inzendingen.'));
      return;
    }
    arr.forEach(s=>{
      const sub = h('div',{style:{
        background:'var(--card2)',border:'1px solid var(--border)',
        borderRadius:'12px',padding:'14px',marginBottom:'10px'
      }});
      const vinfo = BP_VARIANTS[s.variant] || {label:s.variant||'—', badge:'mutatie'};
      sub.appendChild(h('div',{style:{display:'flex',gap:'10px',alignItems:'center',marginBottom:'8px',flexWrap:'wrap'}},
        h('span',{class:'bp-variant '+vinfo.badge}, vinfo.label),
        h('strong',{}, s.name||'?'),
        s.klass && h('span',{style:{color:'var(--accent)',fontWeight:'700',fontSize:'12px'}}, s.klass),
        s.submitted
          ? h('span',{style:{fontSize:'11px',color:'var(--ok)',fontWeight:'800',letterSpacing:'.5px'}},'✓ INGELEVERD')
          : h('span',{style:{fontSize:'11px',color:'var(--muted)',fontWeight:'700'}},'concept'),
        h('span',{style:{marginLeft:'auto',color:'var(--muted)',fontSize:'11px'}},
          s.ts ? new Date(s.ts).toLocaleString('nl-NL') : '')
      ));
      sub.appendChild(h('div',{style:{
        whiteSpace:'pre-wrap',fontFamily:'ui-monospace,monospace',

let studentPushUnsub = null;
let studentThemeUnsub = null;

function renderStudent(){
  const root = $('#app');
  root.innerHTML = '';
  const wrap = h('div',{class:'student-wrap'});
  wrap.appendChild(h('header',{class:'topbar', style:{borderRadius:'16px'}},
    h('div',{class:'brand'}, h('span',{class:'shield'},'★'),'Themalessen – student'),
    h('div',{class:'user-info'},
      h('span',{},'👨‍🎓 '+state.user.name+' • '+state.user.klass),
      h('button',{class:'btn ghost small', onclick:logout},'Uitloggen')
    )
  ));

  if(!state.pushedTheme){
    const empty = h('div',{class:'empty-state', style:{marginTop:'20px'}});
    empty.append(
      h('div',{style:{fontSize:'52px'}},'⏳'),
      h('div',{style:{fontSize:'17px',fontWeight:'600',color:'var(--text)'}},'Wachten op de les…'),
      h('p',{style:{maxWidth:'380px'}}, 'Klas: ' + state.user.klass + '. Zodra de docent een thema start, verschijnt het hier automatisch.')
    );
    wrap.appendChild(empty);
    root.appendChild(wrap);
    return;
  }

  const t = state.pushedTheme;
  const themeSubjects = getThemeSubjects(t);

  const hero = h('div',{class:'hero'},
    h('h1',{}, t.name||'Thema'),
    h('div',{class:'meta'},
      h('span',{class:'chip class'},'🏫 '+state.user.klass),
      ...themeSubjects.map(s=>h('span',{class:'chip subject'},'📘 '+s)),
      t.objective && h('span',{class:'chip objective'},'🎯 '+t.objective)
    )
  );
  if(t.description) hero.appendChild(h('p',{style:{marginTop:'14px',color:'#cbd5e1',lineHeight:'1.7',position:'relative'}}, t.description));
  wrap.appendChild(hero);

  const actsWrap = h('div',{class:'student-acts'});

  const activities = t.activities||[];
  const groups = {};
  activities.forEach(a=>{
    const s = a.subject || '';
    if(!groups[s]) groups[s] = [];
    groups[s].push(a);
  });
  const order = [];
  themeSubjects.forEach(s=>{ if(groups[s]) order.push(s); });
  Object.keys(groups).forEach(s=>{
    if(s && !themeSubjects.includes(s)) order.push(s);
  });
  if(groups['']) order.push('');

  const showHeaders = order.length > 1;

  order.forEach(subj=>{
    const acts = groups[subj];
    if(showHeaders){
      actsWrap.appendChild(h('div',{class:'subject-header'},
        h('h3',{}, subj ? '📘 '+subj : '⚪ Algemeen'),
        h('span',{class:'subject-count'}, acts.length + ' onderdeel' + (acts.length===1?'':'en'))
      ));
    }
    acts.forEach(a=>{
      const node = renderStudentActivity(a, state.myPushedId);
      if(node) actsWrap.appendChild(node);
    });
  });

  wrap.appendChild(actsWrap);
  root.appendChild(wrap);
}

/* ================= ACTIVITY RENDERERS (student) ================= */
function renderStudentActivity(act, tid){
  if(act.type==='text'){
    if(!act.title && !act.body) return null;
    return h('div',{class:'student-act'},
      act.title && h('h3',{},'📝 '+act.title),
      act.body && h('p',{}, act.body)
    );
  }
  if(act.type==='image'){
    if(!act.url) return null;
    return h('div',{class:'student-act'},
      h('h3',{},'🖼️ Afbeelding'),
      h('img',{src:act.url, alt:act.caption||''}),
      act.caption && h('p',{style:{marginTop:'8px',color:'var(--muted)',fontSize:'13px'}}, act.caption)
    );
  }
  if(act.type==='youtube'){
    if(!act.url) return null;
    const m = act.url.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);
    const src = m ? `https://www.youtube.com/embed/${m[1]}` : act.url;
    return h('div',{class:'student-act'},
      h('h3',{},'▶️ Video'),
      h('iframe',{src, allow:'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture', allowfullscreen:'true'}),
      act.caption && h('p',{style:{marginTop:'8px',color:'var(--muted)',fontSize:'13px'}}, act.caption)
    );
  }
  if(act.type==='iframe'){
    if(!act.url) return null;
    return h('div',{class:'student-act'},
      h('h3',{},'🌐 '+(act.title||'Website')),
      h('iframe',{src:act.url, sandbox:'allow-scripts allow-same-origin allow-forms allow-popups'})
    );
  }
  if(act.type==='openq'){
    const card = h('div',{class:'student-act'});
    card.append(
      h('h3',{},'💬 '+(act.question||'Open vraag')),
      act.hint && h('p',{style:{color:'var(--muted)',fontSize:'13px',marginBottom:'8px'}}, act.hint)
    );
    const input = h('textarea',{class:'input', placeholder:'Typ hier je antwoord…', rows:2});
    const feed = h('div',{class:'feed'});
    const sub = h('button',{class:'btn primary', onclick:()=>{
      const v = input.value.trim(); if(!v) return;
      push(ref(db,`responses/${tid}/${act.id}/answers`), {name:state.user.name, klass:state.user.klass, text:v, ts:Date.now()});
      input.value='';
    }},'Verstuur');
    card.appendChild(h('div',{class:'answer-row'}, input, sub));
    card.appendChild(feed);

    const answersRef = ref(db,`responses/${tid}/${act.id}/answers`);
    const unsub = onValue(answersRef, snap=>{
      const data = snap.val()||{};
      const arr = Object.values(data).sort((a,b)=>a.ts-b.ts).slice(-40);
      feed.innerHTML='';
      arr.forEach(a=>{
        feed.appendChild(h('div',{class:'feed-item'},
          h('div',{class:'who'}, (a.name||'?') + (a.klass? ' • '+a.klass : '')),
          h('div',{class:'msg'}, a.text)
        ));
      });
      feed.scrollTop = feed.scrollHeight;
    });
    track(unsub);
    return card;
  }
  if(act.type==='quiz'){
    const card = h('div',{class:'student-act'});
    card.appendChild(h('h3',{},'🧠 Quiz'));
    const qs = act.questions||[];
    if(!qs.length) card.appendChild(h('p',{style:{color:'var(--muted)'}},'Nog geen vragen.'));
    const myRef = ref(db,`responses/${tid}/${act.id}/${state.userId}`);
    let myAnswers = {};
    const scoreEl = h('div',{class:'quiz-score'},'');

    qs.forEach((q,qi)=>{
      const qc = h('div',{class:'quiz-q'});
      qc.appendChild(h('div',{class:'qtext'}, (qi+1)+'. '+q.q));
      if(q.qtype==='mc'){
        (q.options||[]).forEach((opt,oi)=>{
          const row = h('label',{class:'quiz-opt'},
            h('input',{type:'radio', name:'q'+act.id+'_'+qi, onchange:()=>{
              update(myRef, {['q'+qi]: oi});
              $$('.quiz-opt', qc).forEach((el,j)=>{
                el.classList.remove('correct','wrong');
                if(j===q.correct) el.classList.add('correct');
                else if(j===oi) el.classList.add('wrong');
              });
              checkScore();
            }}),
            opt
          );
          qc.appendChild(row);
        });
      } else if(q.qtype==='auto'){
        const inp = h('input',{class:'input', placeholder:'Jouw antwoord', oninput:e=>{
          clearTimeout(inp._t);
          inp._t = setTimeout(()=>update(myRef, {['q'+qi]: e.target.value}), 350);
        }});
        qc.appendChild(inp);
      } else {
        const ta = h('textarea',{class:'input', rows:2, placeholder:'Jouw antwoord…', oninput:e=>{
          clearTimeout(ta._t); ta._t = setTimeout(()=>update(myRef, {['q'+qi]: e.target.value}), 400);
        }});
        qc.appendChild(ta);
      }
      card.appendChild(qc);
    });
    card.appendChild(scoreEl);

    function checkScore(){
      let correct=0, auto=0;
      qs.forEach((q,qi)=>{
        const ans = myAnswers['q'+qi];
        if(q.qtype==='mc'){ auto++; if(ans===q.correct) correct++; }
        else if(q.qtype==='auto'){
          auto++;
          const valid = String(q.answer||'').split('|').map(s=>s.trim().toLowerCase()).filter(Boolean);
          if(valid.includes(String(ans||'').trim().toLowerCase())) correct++;
        }
      });
      scoreEl.textContent = auto ? `✅ Score: ${correct} / ${auto} (auto-gecorrigeerd)` : '';
    }
    const unsub = onValue(myRef, snap=>{ myAnswers = snap.val()||{}; checkScore(); });
    track(unsub);
    return card;
  }
  if(act.type==='beroepsproduct') return renderBeroepsproduct(act, tid);
  if(act.type==='drag') return renderDragBoard(act, tid);
  if(act.type==='traffic') return renderTrafficBoard(act, tid);
  if(act.type==='whiteboard') return renderWhiteboard(act, tid);
  return null;
}

/* ================= BEROEPSPRODUCT (student) ================= */
function renderBeroepsproduct(act, tid){
  const card = h('div',{class:'student-act'});
  const variant = act.variant || 'mutatie';
  const vinfo = BP_VARIANTS[variant] || {label:variant, badge:'mutatie'};
  const variantNaam = variant==='mutatie' ? 'mutatie'
                    : variant==='pv-aangifte' ? 'proces-verbaal van aangifte'
                    : 'proces-verbaal van bevindingen';

  card.appendChild(h('div',{style:{display:'flex',gap:'10px',alignItems:'center',flexWrap:'wrap',marginBottom:'12px'}},
    h('h3',{style:{margin:0}},'📋 '+(act.title||'Beroepsproduct')),
    h('span',{class:'bp-variant '+vinfo.badge}, vinfo.label)
  ));

  if(act.casus){
    card.appendChild(h('div',{class:'bp-casus'}, act.casus));
  }

  const wrap = h('div',{class:'bp-wrap'});

  /* ---------- CHECKLIST ---------- */
  const check = h('div',{class:'bp-checklist'});
  check.appendChild(h('h4',{},'✅ Checklist – eisen'));
  const cl = Array.isArray(act.checklist) ? act.checklist : [];
  if(!cl.length){
    check.appendChild(h('div',{class:'obj-empty'},'Geen checklist opgegeven.'));
  }

  const checksRef = ref(db,`responses/${tid}/${act.id}/checks/${state.userId}`);
  const subRef    = ref(db,`responses/${tid}/${act.id}/submissions/${state.userId}`);

  cl.forEach((item,i)=>{
    const cb = h('input',{type:'checkbox'});
    const row = h('label',{class:'bp-check'},
      cb,
      h('span',{class:'bullet'},'•'),
      h('span',{}, item)
    );
    cb.addEventListener('change', ()=>update(checksRef, {['c'+i]: cb.checked}));
    row._cb = cb;
    check.appendChild(row);
  });

  const unsubChk = onValue(checksRef, snap=>{
    const data = snap.val()||{};
    $$('.bp-check', check).forEach((row,i)=>{
      const on = !!data['c'+i];
      row._cb.checked = on;
      row.classList.toggle('done', on);
    });
  });
  track(unsubChk);

  wrap.appendChild(check);

  /* ---------- EDITOR ---------- */
  const right = h('div',{class:'bp-editor-area'});
  const ta = h('textarea',{
    class:'input bp-textarea',
    placeholder:'Schrijf hier je '+variantNaam+'…'
  });
  const count = h('div',{class:'bp-count'},'0 tekens');
  const status = h('span',{class:'bp-status'},'');
  const saveBtn = h('button',{class:'btn primary', onclick:async ()=>{
    const txt = ta.value;
    if(!txt.trim()) return toast('Schrijf eerst je stuk','error');
    await update(subRef, {
      text: txt, name: state.user.name, klass: state.user.klass,
      variant, submitted: true, ts: Date.now()
    });
    toast('Ingeleverd ✓','success');
  }},'💾 Inleveren');

  let suppressServerOverwrite = false;
  ta.addEventListener('input', ()=>{
    count.textContent = ta.value.length + ' tekens';
    suppressServerOverwrite = true;
    clearTimeout(ta._t);
    ta._t = setTimeout(async ()=>{
      await update(subRef, {
        text: ta.value, name: state.user.name, klass: state.user.klass,
        variant, submitted: false, ts: Date.now()
      });
      suppressServerOverwrite = false;
    }, 900);
  });

  right.appendChild(ta);
  right.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',gap:'10px'}},
    status, count
  ));
  right.appendChild(h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap'}},
    saveBtn,
    h('button',{class:'btn ghost small', onclick:()=>{
      if(confirm('Je ingeleverd werk verwijderen?')) remove(subRef);
    }},'🗑 Verwijderen')
  ));

  const unsubSub = onValue(subRef, snap=>{
    const v = snap.val();
    if(v && typeof v.text === 'string' && !suppressServerOverwrite && document.activeElement !== ta){
      ta.value = v.text;
      count.textContent = ta.value.length + ' tekens';
    }
    if(v && v.submitted && v.ts){
      status.textContent = '✓ Ingeleverd: ' + new Date(v.ts).toLocaleString('nl-NL');
    } else if(v && v.ts){
      status.textContent = 'Concept opgeslagen: ' + new Date(v.ts).toLocaleString('nl-NL');
    } else {
      status.textContent = '';
    }
  });
  track(unsubSub);

  wrap.appendChild(right);
  card.appendChild(wrap);

  /* ---------- LIVE FEED (docent bepaalt zichtbaarheid) ---------- */
  const feedWrap = h('div',{class:'bp-list'});
  card.appendChild(feedWrap);

  const subsRef = ref(db,`responses/${tid}/${act.id}/submissions`);
  const actRef  = ref(db,`themes/${tid}/activities`);

  let subsData = {};
  let isPublic = false;
  let hasRenderedOnce = false;

  function renderFeed(){
    feedWrap.innerHTML='';

    const arr = Object.values(subsData)
      .filter(x=>x && x.submitted)
      .sort((a,b)=>(b.ts||0)-(a.ts||0));

    if(!isPublic){
      /* 🔒 Docent heeft feed nog niet vrijgegeven: alleen namen */
      feedWrap.appendChild(h('div',{class:'bp-feed-head'},
        h('h4',{},'📥 Ingeleverd door klas '+(state.user.klass||'')),
        h('span',{style:{fontSize:'11px',color:'var(--muted)',fontWeight:'600'}},'🔒 teksten nog niet vrijgegeven')
      ));
      const nameList = h('div',{class:'bp-feed'});
      if(!arr.length){
        nameList.appendChild(h('div',{class:'bp-feed-empty'},'Nog niets ingeleverd'));
      } else {
        arr.forEach(s=>{
          nameList.appendChild(h('div',{class:'bp-list-row'},
            h('span',{class:'nm'}, s.name||'?'),
            h('span',{class:'kl'}, s.klass||''),
            h('span',{class:'ts'}, s.ts ? new Date(s.ts).toLocaleString('nl-NL') : '')
          ));
        });
      }
      feedWrap.appendChild(nameList);
      return;
    }

    /* 📡 Feed is vrijgegeven: volledige teksten live */
    const withText = arr.filter(x=>x.text && x.text.trim());
    feedWrap.appendChild(h('div',{class:'bp-feed-head'},
      h('h4',{},'📡 Live feed – ingeleverd door klas '+(state.user.klass||'')),
      h('span',{style:{fontSize:'11px',color:'var(--ok)',fontWeight:'800'}},'● live')
    ));
    const feedList = h('div',{class:'bp-feed'});
    if(!withText.length){
      feedList.appendChild(h('div',{class:'bp-feed-empty'},
        'Nog geen ingeleverd werk — zodra iemand op 💾 Inleveren klikt, verschijnt het hier live.'));
    } else {
      withText.forEach(s=>{
        feedList.appendChild(h('div',{class:'bp-feed-item'},
          h('div',{class:'who'},
            h('span',{}, s.name||'?'),
            s.klass && h('span',{class:'kl'}, s.klass),
            h('span',{class:'ts'}, s.ts ? new Date(s.ts).toLocaleString('nl-NL') : '')
          ),
          h('div',{class:'msg'}, s.text)
        ));
      });
    }
    feedWrap.appendChild(feedList);

    if(!hasRenderedOnce){
      hasRenderedOnce = true;
      toast('📡 De docent heeft de teksten vrijgegeven','success');
    }
  }

  const unsubSubs = onValue(subsRef, snap=>{
    subsData = snap.val()||{};
    renderFeed();
  });
  const unsubAct = onValue(actRef, snap=>{
    const acts = snap.val()||[];
    const found = Array.isArray(acts) ? acts.find(x=>x.id===act.id) : null;
    isPublic = !!(found && found.feedPublic);
    renderFeed();
  });
  track(unsubSubs);
  track(unsubAct);

  return card;
}

/* ================= DRAG BOARD ================= */
function renderDragBoard(act, tid){
  const card = h('div',{class:'student-act'});
  card.appendChild(h('h3',{},'🖱️ '+(act.title||'Sleepopdracht')));
  const board = h('div',{class:'board'});
  card.appendChild(board);

  const itemsRef = ref(db,`responses/${tid}/${act.id}/positions`);
  const items = act.items||[];
  items.forEach((label,i)=>{
    const x = 0.1 + (i%4)*0.2;
    const y = 0.15 + Math.floor(i/4)*0.25;
    const el = h('div',{class:'drag-item', dataset:{key:'item'+i}},
      h('div',{class:'label'}, label),
      h('div',{style:{width:'40px',height:'40px',borderRadius:'10px',background:'linear-gradient(135deg,#1e3a8a,#2563eb)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'22px',boxShadow:'0 3px 8px rgba(0,0,0,.4)'}},'📦')
    );
    el.style.left = (x*100)+'%'; el.style.top = (y*100)+'%';
    board.appendChild(el);
  });

  function bindDrag(el, key){
    let dragging=false, ox=0, oy=0;
    el.addEventListener('pointerdown', e=>{
      dragging=true; el.setPointerCapture(e.pointerId);
      const r = el.getBoundingClientRect(); ox = e.clientX-r.left; oy = e.clientY-r.top;
    });
    el.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const br = board.getBoundingClientRect();
      let x = (e.clientX-br.left-ox)/br.width;
      let y = (e.clientY-br.top-oy)/br.height;
      x = Math.max(0,Math.min(1,x)); y = Math.max(0,Math.min(1,y));
      el.style.left = (x*100)+'%'; el.style.top = (y*100)+'%';
      clearTimeout(el._t);
      el._t = setTimeout(()=>update(itemsRef, {[key]:{x,y}}), 60);
    });
    const stop = ()=>{ dragging=false; };
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointercancel', stop);
  }
  $$('.drag-item', board).forEach((el,i)=>bindDrag(el,'item'+i));

  const unsub = onValue(itemsRef, snap=>{
    const data = snap.val()||{};
    $$('.drag-item', board).forEach((el,i)=>{
      const p = data['item'+i]; if(!p) return;
      if(el.matches(':active')) return;
      el.style.left = (p.x*100)+'%'; el.style.top = (p.y*100)+'%';
    });
  });
  track(unsub);
  return card;
}
